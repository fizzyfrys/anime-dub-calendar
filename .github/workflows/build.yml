name: Build Anime Dub Calendar

on:
  schedule:
    # Run daily at 10:00 UTC (6:00 AM ET / 3:00 AM PT)
    - cron: '0 10 * * *'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so git commit works
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify live sources without publishing
        run: |
          node src/index.js --output-dir "$RUNNER_TEMP/calendar-preview"
          jq '{baseline: .dubCalendar.lastHealthyRowCount, cachedReleases: (.dubCalendar.releases | length)}' "$RUNNER_TEMP/calendar-preview/state.json"
          jq -e '.releases | length | select(. > 0)' "$RUNNER_TEMP/calendar-preview/schedule.json"
