name: Build Anime Dub Calendar

on:
  schedule:
    # Run daily at 10:00 UTC (6:00 AM ET / 3:00 AM PT)
    - cron: '0 10 * * *'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so git commit works
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build calendar feed
        run: node src/index.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/anime-dubs.ics docs/schedule.json docs/state.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update anime dub calendar [$(date -u '+%Y-%m-%d')]"
            git push
          fi
