name: Build Docker image

on:
  pull_request:
    paths: &container-paths
      - '.github/workflows/container.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package*.json'
      - 'src/**'
      - 'web/**'
      - 'docs/index.html'
      - 'docs/feed-url.js'
      - 'test/container-smoke.sh'
  push:
    branches: [main]
    paths: *container-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t anime-dub-calendar:ci .
      - run: bash test/container-smoke.sh anime-dub-calendar:ci

  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test release image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          docker build \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$version" .
          bash test/container-smoke.sh "$image:$version"
          docker tag "$image:$version" "$image:sha-${GITHUB_SHA::12}"
          docker tag "$image:$version" "$image:latest"
          echo "IMAGE_VERSION=$version" >>"$GITHUB_ENV"
      - name: Push the tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tags=("$IMAGE_VERSION" "sha-${GITHUB_SHA::12}" latest)
          for tag in "${tags[@]}"; do
            docker push "$image:$tag"
          done
          {
            echo "Pushed \`$image\` with tags:"
            printf -- '- `%s`\n' "${tags[@]}"
          } >>"$GITHUB_STEP_SUMMARY"
