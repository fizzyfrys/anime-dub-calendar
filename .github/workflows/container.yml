name: Build Docker image

on:
  pull_request:
    paths: &container-paths
      - '.github/workflows/container.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package*.json'
      - 'src/**'
      - 'web/**'
      - 'docs/index.html'
      - 'docs/feed-url.js'
      - 'test/container-smoke.sh'
  push:
    branches: [main]
    paths: *container-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t anime-dub-calendar:ci .
      - run: bash test/container-smoke.sh anime-dub-calendar:ci

  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test release image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --tag "$image:latest" --tag "$image:sha-${GITHUB_SHA::12}" .
          bash test/container-smoke.sh "$image:latest"
      - name: Push the tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:sha-${GITHUB_SHA::12}"
          docker push "$image:latest"
